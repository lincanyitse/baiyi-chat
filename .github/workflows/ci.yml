name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Vite 8 要求 Node ^20.19 或 >=22.12，Node 18 无法构建前端。
      - name: 前端测试
        run: npm --prefix web ci && npm --prefix web test

      - name: 前端构建
        run: npm --prefix web run build

      - name: Go 测试
        run: CGO_ENABLED=0 go test ./...

      - name: go vet
        run: go vet ./...

      - name: 分层检查
        run: bash scripts/check-layering.sh

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi
